# ==============================================================================
# RODO MOTO MANDADOS · PRODUCCIÓN HOSTINGER VPS (SIN CONFLICTOS EN 80/443)
# - Reutiliza tu contenedor PostgreSQL 16 existente (ej. rodo-db-1)
# - Expone la app (Nginx + API + WebSockets) en WEB_PORT (por defecto 8080)
#   para no chocar con los puertos 80 y 443 ya ocupados en tu VPS.
# ==============================================================================
services:
  rodo-redis:
    image: redis:7-alpine
    container_name: rodo-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - rodo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rodo-internal

  rodo-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rodo-api
    restart: always
    depends_on:
      rodo-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-rodo_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en produccion}@${POSTGRES_HOST:-rodo-db-1}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rodo_db}?schema=public
      REDIS_URL: redis://rodo-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en produccion}
      INE_ENCRYPTION_KEY: ${INE_ENCRYPTION_KEY:?INE_ENCRYPTION_KEY es obligatorio en produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-edsoncruz14999@gmail.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD es obligatorio en produccion}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - rodo_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"
    networks:
      - rodo-internal
      - existing-postgres

  # Nginx sirve la PWA React y hace proxy interno a /api, /socket.io y /uploads
  # Apunta tu proxy principal (puertos 80/443) hacia http://127.0.0.1:${WEB_PORT:-8080}
  rodo-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rodo-web
    restart: always
    depends_on:
      rodo-api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rodo-internal

  # Respaldo automático diario de la BD rodo_db alojada en el Postgres existente (retención 14 días)
  rodo-backup:
    image: postgres:16-alpine
    container_name: rodo-backup
    restart: always
    environment:
      PGHOST: ${POSTGRES_HOST:-rodo-db-1}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:-rodo_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en produccion}
      PGDATABASE: ${POSTGRES_DB:-rodo_db}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups/postgres:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[RODO Backup] Respaldos diarios activos contra $${PGHOST}:$${PGPORT}/$${PGDATABASE} (retencion: $${BACKUP_KEEP_DAYS} dias)"
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S)
          if pg_dump | gzip > "/backups/$${PGDATABASE}_$${TS}.sql.gz"; then
            echo "[RODO Backup] Respaldo creado: $${PGDATABASE}_$${TS}.sql.gz"
          else
            echo "[RODO Backup] Advertencia: fallo temporal en pg_dump, reintentara en el siguiente ciclo"
          fi
          find /backups -type f -name "*.sql.gz" -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - rodo-internal
      - existing-postgres

volumes:
  rodo_redisdata:
  rodo_uploads:

networks:
  rodo-internal:
    driver: bridge
  existing-postgres:
    external: true
    name: ${POSTGRES_NETWORK:?Define POSTGRES_NETWORK con el nombre de la red Docker de tu contenedor Postgres (ej. rodo_default)}

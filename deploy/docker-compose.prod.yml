services:
  rodo-db:
    image: postgres:16-alpine
    container_name: rodo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rodo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en produccion}
      POSTGRES_DB: ${POSTGRES_DB:-rodo_db}
    volumes:
      - rodo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rodo_user} -d ${POSTGRES_DB:-rodo_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rodo-internal

  rodo-redis:
    image: redis:7-alpine
    container_name: rodo-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - rodo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rodo-internal

  rodo-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rodo-api
    restart: always
    depends_on:
      rodo-db:
        condition: service_healthy
      rodo-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-rodo_user}:${POSTGRES_PASSWORD}@rodo-db:5432/${POSTGRES_DB:-rodo_db}?schema=public
      REDIS_URL: redis://rodo-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-edsoncruz14999@gmail.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD es obligatorio en produccion}
      CORS_ORIGIN: https://${DOMAIN:-localhost}
      UPLOADS_DIR: /app/uploads
    volumes:
      - rodo_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"
    networks:
      - rodo-internal

  rodo-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rodo-web
    restart: always
    depends_on:
      rodo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rodo-internal

  # Proxy TLS con certificado SSL Let's Encrypt automático (HTTPS obligatorio para GPS y PWA)
  rodo-proxy:
    image: caddy:2-alpine
    container_name: rodo-proxy
    restart: always
    depends_on:
      rodo-web:
        condition: service_healthy
      rodo-api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - rodo_caddy_data:/data
      - rodo_caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rodo-internal

  # Respaldo automático diario de PostgreSQL con retención de 14 días
  rodo-backup:
    image: postgres:16-alpine
    container_name: rodo-backup
    restart: always
    depends_on:
      rodo-db:
        condition: service_healthy
    environment:
      PGHOST: rodo-db
      PGUSER: ${POSTGRES_USER:-rodo_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-rodo_db}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups/postgres:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[RODO Backup] Servicio de respaldos diarios iniciado (retencion: $${BACKUP_KEEP_DAYS} dias)"
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S)
          pg_dump | gzip > "/backups/rodo_db_$${TS}.sql.gz" && echo "[RODO Backup] Respaldo creado: rodo_db_$${TS}.sql.gz"
          find /backups -type f -name "*.sql.gz" -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - rodo-internal

volumes:
  rodo_pgdata:
  rodo_redisdata:
  rodo_uploads:
  rodo_caddy_data:
  rodo_caddy_config:

networks:
  rodo-internal:
    driver: bridge
